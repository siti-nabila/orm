site_name: ORM Documentation
site_description: Lightweight and explicit Go ORM documentation
repo_name: siti-nabila/orm
repo_url: https://github.com/siti-nabila/orm
use_directory_urls: true
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Gunakan tema gelap
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Gunakan tema terang

plugins:
  search: {}

markdown_extensions:
  admonition: {}
  attr_list: {}
  md_in_html: {}
  toc:
    permalink: true
  pymdownx.highlight:
    anchor_linenums: true
  pymdownx.inlinehilite: {}
  pymdownx.superfences: {}

copyright: Copyright &copy; siti-nabila
