INHERIT: mkdocs.base.yml

site_name: ORM Documentation
site_url: https://siti-nabila.github.io/orm/en/
docs_dir: .docs-build/en
site_dir: site/en

theme:
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  alternate:
    - name: Bahasa Indonesia
      link: /orm/id/
      lang: id
    - name: English
      link: /orm/en/
      lang: en

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Query Builder: query-builder.md
  - Create, Update, and Bulk Writes: create-update.md
  - Scanning Results: scan.md
  - Pagination: pagination.md
  - Dry Run: dry-run.md
  - Transactions and Locking: transactions.md
  - Dialect Notes: dialects.md
  - Examples: examples.md
